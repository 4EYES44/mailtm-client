[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mailtm-client-wrapper"
version = "0.1.0"
description = "A robust Python client for the MailTM API"
readme = "README.md"
authors = [
    {name = "YourName", email = "your.email@example.com"}
]
keywords = ["mailtm", "disposable-email", "api-client", "automation"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "build>=1.5.0",
    "requests>=2.28.0",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/mailtm-client-wrapper"
"Bug Tracker" = "https://github.com/yourusername/mailtm-client-wrapper/issues"

[dependency-groups]
dev = [
    "pytest",
    "responses",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "live: hits the real Mail.tm API; skipped unless MAILTM_LIVE=1",
]
